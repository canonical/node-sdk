summary: Verify Node.js SDK command versions are usable

prepare: |
  envsubst '${BASE}' <workshop.yaml.in >workshop.yaml
  workshop launch

execute: |
  workshop exec -- node --version | MATCH '^v[0-9]+\.[0-9]+\.[0-9]+'
  workshop exec -- npm --version | MATCH '^[0-9]+\.[0-9]+\.[0-9]+'
  workshop exec -- corepack --version | MATCH '^[0-9]+\.[0-9]+\.[0-9]+'

debug: |
  workshop exec -- node --version || true
  workshop exec -- npm --version || true
  workshop exec -- corepack --version || true
  workshop exec -- which node npm corepack || true
  workshop tasks

restore: |
  workshop remove || true
